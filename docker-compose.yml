# ─────────────────────────────────────────────────────────────────────────────
# SERVER DEPLOYMENT ONLY.
#
# The primary product is now a standalone Windows desktop app (NativePHP +
# Electron) that runs on SQLite and starts FastAPI itself - it does not use
# this file at all. See the "Aplikasi Desktop" section in README.md.
#
# Keep this stack for hosting the dashboard on a server, where PostgreSQL and
# a separate queue worker still make sense.
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scanner_db
    environment:
      POSTGRES_DB: scanner_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped



  queue_worker:
    build: 
      context: ./scanner-app
    container_name: scanner_queue_worker
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=scanner_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - FASTAPI_URL=http://fastapi:8081
    volumes:
      - ./scanner-app:/app
    depends_on:
      - db
      - fastapi
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=120

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanner_fastapi
    ports:
      - "8081:8081"
    environment:
      # FastAPI calls Laravel back for extraction status and learned patterns.
      # Laravel is not a service in this stack, so reach it on the host.
      - LARAVEL_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    restart: unless-stopped
    # Port stays 8081 here; only the desktop build moved to 8091.
    command: bash -c "cd /app/src && uvicorn fastapi_app:app --host 0.0.0.0 --port 8081"

volumes:
  db_data:
